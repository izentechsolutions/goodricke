server {
    listen       8080 default_server;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # Images, fonts and video never change under the same name: cache for 30 days.
    location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # CSS/JS keep their names when edited, so let browsers re-check them daily.
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
